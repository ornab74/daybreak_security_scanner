name: Build desktop applications

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m py_compile main.py app.py lockfiles.py

  build:
    name: Build · ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-x86_64
            executable: DaybreakScanner
          - os: windows-latest
            label: Windows-x86_64
            executable: DaybreakScanner.exe
          - os: macos-14
            label: macOS-arm64
            executable: DaybreakScanner
          - os: macos-13
            label: macOS-x86_64
            executable: DaybreakScanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build unified CLI/TUI/GUI executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --name DaybreakScanner
          --collect-all customtkinter --collect-all keyring
          --hidden-import app --hidden-import lockfiles main.py
      - name: Smoke test executable
        shell: bash
        run: ./dist/${{ matrix.executable }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: DaybreakScanner-${{ matrix.label }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

